<title>Front System Diagnostic</title>
<meta name="theme-color" content="#0E1115">
<style>
/* Layout: sticky header + tab pages; overview cards flow in columns; bottom tab bar on phones, tabs in the header from 900px. */
:root {
  --bg: #0E1115; --surface: #171C22; --surface-hi: #1F252D; --line: #2A323C;
  --text: #E7EBEF; --muted: #8D98A3; --amber: #FFB300; --on-amber: #241A00;
  --ok: #3FC97A; --bad: #FF5A5F; --off: #313942; --info: #5AA9FF;
  --lamp-white: #F4F7FA; --lamp-red: #FF3B30; --orange: #FF8B28; --boost: #E9DC13;
  --f-body: "Roboto", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: ui-monospace, "Roboto Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 99px; padding: 8px 13px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--pc); background: color-mix(in srgb, var(--pc) 15%, transparent); white-space: nowrap; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
.pill.busy .dot { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; color: var(--muted); font-size: 12px; cursor: pointer; position: relative; }
nav.tabs .ico { width: 56px; height: 30px; border-radius: 99px; display: grid; place-items: center; transition: background .15s; }
nav.tabs svg { width: 22px; height: 22px; fill: currentColor; }
nav.tabs .ico span { display: none; }
nav.tabs button[aria-current="page"] { color: var(--text); }
nav.tabs button[aria-current="page"] .ico { background: var(--amber); color: var(--on-amber); }
.badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
main { width: 100%; max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 4px calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  nav.tabs { position: static; display: flex; gap: 4px; background: none; border: 0; padding: 0; }
  nav.tabs button { flex-direction: row; gap: 8px; padding: 0; font-size: 14px; }
  nav.tabs .ico { width: auto; height: 36px; padding: 0 14px 0 10px; gap: 8px; display: flex; align-items: center; }
  nav.tabs .ico span { display: inline; }
  nav.tabs button > .txt { display: none; }
  .badge { top: -4px; left: auto; right: -4px; }
  main { padding-block: 8px 32px; }
}

/* cards */
.grid { columns: 340px; column-gap: 12px; }
.card { break-inside: avoid; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head .label { flex: 1; }
.state { font-size: 13px; font-weight: 600; }
.full { margin-bottom: 12px; }
.dim .grid { opacity: .6; }
.page[hidden] { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { --cc: var(--amber); display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: var(--surface-hi); border: 1px solid transparent; font: 12px var(--f-mono); color: var(--muted); transition: background .15s, border-color .15s, color .15s; }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--off); transition: background .15s; }
.chip.on { background: color-mix(in srgb, var(--cc) 16%, transparent); border-color: color-mix(in srgb, var(--cc) 70%, transparent); color: var(--text); }
.chip.on::before { background: var(--cc); }
[data-c="ok"] { --cc: var(--ok); } [data-c="bad"] { --cc: var(--bad); } [data-c="orange"] { --cc: var(--orange); } [data-c="info"] { --cc: var(--info); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-hi); }
.seg span { text-align: center; padding: 10px 4px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .18s, color .18s; }
.seg span.active { background: var(--amber); color: var(--on-amber); font-weight: 700; }

.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric b { display: block; font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.metric b.bad { color: var(--bad); }

/* drawings */
.drawing { width: 100%; max-width: 360px; margin: 0 auto; display: block; }
.gauge .track { stroke: var(--off); }
.gauge .band { stroke: color-mix(in srgb, var(--ok) 30%, transparent); }
.gauge .value { stroke: var(--ok); transition: stroke .2s; }
.gauge.out .value, .gauge.out .marker { stroke: var(--amber); }
.gauge .marker { fill: var(--surface); stroke: var(--ok); stroke-width: 7; }
.gauge .tick { stroke: var(--muted); stroke-width: 1.5; opacity: .45; }
.gauge .tick.major { opacity: .9; }
.gauge .target { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
.gauge .num { fill: var(--text); font: 700 48px var(--f-body); }
.gauge .unit { fill: var(--muted); font: 13px var(--f-body); }

.lamp .glow { opacity: 0; transition: opacity .15s; }
.lamp .core { fill: var(--off); stroke: var(--line); stroke-width: 1.6; transition: fill .15s; }
.lamp .hl { fill: #fff; opacity: 0; transition: opacity .15s; }
.lamp.on .glow { opacity: 1; }
.lamp.on .hl { opacity: .55; }
.lamp.on[data-c="white"] .core { fill: var(--lamp-white); }
.lamp.on[data-c="red"] .core { fill: var(--lamp-red); }
.lamp.on[data-c="ok"] .core { fill: var(--ok); }
.lamp.on[data-c="orange"] .core { fill: var(--orange); }
.lamp.on[data-c="amber"] .core { fill: var(--amber); }
.lamp.on[data-c="boost"] .core { fill: var(--boost); }
.sides { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

.door .leaf { fill: #2E3742; stroke: var(--off); stroke-width: 4; transition: stroke .2s, transform .4s; }
.door .leaf.inflate { stroke: var(--ok); } .door .leaf.deflate { stroke: var(--bad); }
.door .leaf.pushed { transform: translateX(9px); }
.door .diaph { fill: var(--off); transition: fill .2s; } .door .diaph.on { fill: var(--amber); }
.door .bolt { transition: transform .25s, fill .2s; fill: none; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 6 5; }
.door .bolt.in, .door .bolt.out { stroke: none; }
.door .bolt.in { fill: var(--ok); } .door .bolt.out { fill: var(--bad); }
.door .bolt.left.in { transform: translateX(15px); } .door .bolt.right.in { transform: translateX(-15px); }

.lampgroups { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; font-size: 11px; color: var(--muted); }
.lampgroups svg { height: 30px; display: block; margin: 0 auto 2px; }
.row { display: flex; align-items: center; gap: 8px; }
.row .grow { flex: 1; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: var(--surface-hi); transition: background .15s; min-width: 0; }
.tile.fault { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.tile b { display: block; font: 700 12px var(--f-mono); color: var(--muted); }
.tile.fault b { color: var(--text); }
.tile small { display: block; font-size: 11px; line-height: 1.2; color: var(--muted); }
.tile svg { flex: none; width: 24px; height: 24px; }

/* connect + errors banner */
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--line); background: none; color: var(--amber); border-radius: 99px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
.btn.primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.problem { color: var(--bad); font-size: 14px; }
.progress { height: 4px; border-radius: 4px; background: var(--off); overflow: hidden; }
.progress::after { content: ""; display: block; height: 100%; width: 40%; background: var(--amber); border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.banner { background: color-mix(in srgb, var(--bad) 12%, transparent); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.banner .label { color: var(--bad); }
.banner a { color: var(--bad); font-size: 13px; cursor: pointer; text-decoration: none; }
.erow { display: flex; gap: 12px; align-items: flex-start; padding: 6px 4px; border-radius: 12px; cursor: pointer; background: none; border: 0; text-align: left; width: 100%; }
.erow .code { font-size: 22px; font-weight: 700; color: var(--bad); width: 40px; flex: none; line-height: 1.2; }
.erow .t { font-weight: 500; }
.erow .d { font-size: 13px; color: var(--muted); }

/* errors page */
.list { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.list h2 { margin: 14px 4px 2px; }
.list .head { display: flex; align-items: center; }
.list .head h2 { flex: 1; }
.ecard { display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface); border: 0; text-align: left; width: 100%; cursor: pointer; }
.ecard.active { background: color-mix(in srgb, var(--bad) 10%, transparent); }
.ecard .code { font-size: 22px; font-weight: 700; width: 46px; flex: none; color: var(--muted); }
.ecard.active .code { color: var(--bad); }
.ecard small { display: block; font-size: 12px; color: var(--muted); }
.ok-box { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: color-mix(in srgb, var(--ok) 10%, transparent); }
.cat { display: flex; gap: 12px; padding: 10px 8px; border-radius: 12px; background: none; border: 0; text-align: left; cursor: pointer; width: 100%; }
.cat b { color: var(--amber); width: 36px; flex: none; }
.textbtn { background: none; border: 0; color: var(--amber); font-weight: 600; cursor: pointer; padding: 6px 8px; }

/* registers page */
.regs { display: flex; flex-direction: column; gap: 14px; }
.reg-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.reg-h b { font: 700 15px var(--f-mono); }
.reg-h span { font: 13px var(--f-mono); color: var(--amber); font-variant-numeric: tabular-nums; }
.bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 6px; }
.bit { height: 40px; border-radius: 8px; background: var(--surface-hi); display: grid; place-items: center; font: 9px var(--f-mono); letter-spacing: -.02em; color: var(--muted); overflow: hidden; white-space: nowrap; transition: background .12s; }
.bit.unused { background: var(--bg); }
.bit.on { background: var(--amber); color: var(--on-amber); font-weight: 700; }
.term-in { display: flex; gap: 8px; }
.term-in input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 16px var(--f-mono); text-transform: uppercase; }
.term-in input:focus { border-color: var(--amber); outline: none; }
.quick { cursor: pointer; border: 0; }
.term-out { background: var(--bg); border-radius: 12px; padding: 12px; font: 13px var(--f-mono); display: flex; flex-direction: column; gap: 4px; max-height: 320px; overflow: auto; }
.term-out .o { color: var(--amber); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; align-items: start; }

/* settings */
.set { display: flex; flex-direction: column; gap: 14px; max-width: 760px; }
.sw { display: flex; align-items: center; gap: 12px; }
.sw div { flex: 1; }
.sw small, .hint { display: block; font-size: 12px; color: var(--muted); }
.sw input { appearance: none; width: 52px; height: 32px; border-radius: 16px; background: var(--off); position: relative; cursor: pointer; transition: background .15s; flex: none; }
.sw input::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.sw input:checked { background: var(--amber); }
.sw input:checked::after { transform: translateX(20px); background: var(--on-amber); }
.slider .row b { color: var(--amber); font-variant-numeric: tabular-nums; }
.slider input { width: 100%; accent-color: var(--amber); }
.langs { display: flex; flex-wrap: wrap; gap: 8px; }
.langs button { border: 1px solid var(--line); background: none; border-radius: 10px; padding: 8px 14px; cursor: pointer; color: var(--text); }
.langs button.active { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }

/* sheet + snackbar */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 640px; max-height: 88%; overflow: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .2s ease-out; }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 24px; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 4px; }
.sheet h2 { margin: 0; font-size: 20px; }
.port { display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 16px; background: var(--surface-hi); border: 1px solid transparent; cursor: pointer; text-align: left; width: 100%; }
.port.kit { border-color: color-mix(in srgb, var(--ok) 60%, transparent); }
.port div { flex: 1; }
.port small { display: block; font-size: 12px; color: var(--muted); }
.port:disabled { opacity: .5; cursor: not-allowed; }
.explain { white-space: pre-wrap; line-height: 1.55; }
.snack { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; background: #E7EBEF; color: #12161B; padding: 12px 18px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
@media (min-width: 900px) { .snack { bottom: 24px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-white"><stop offset="0" stop-color="#F4F7FA" stop-opacity=".55"/><stop offset="1" stop-color="#F4F7FA" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-red"><stop offset="0" stop-color="#FF3B30" stop-opacity=".55"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-ok"><stop offset="0" stop-color="#3FC97A" stop-opacity=".5"/><stop offset="1" stop-color="#3FC97A" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-orange"><stop offset="0" stop-color="#FF8B28" stop-opacity=".5"/><stop offset="1" stop-color="#FF8B28" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-amber"><stop offset="0" stop-color="#FFB300" stop-opacity=".5"/><stop offset="1" stop-color="#FFB300" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-boost"><stop offset="0" stop-color="#E9DC13" stop-opacity=".5"/><stop offset="1" stop-color="#E9DC13" stop-opacity="0"/></radialGradient>
    <linearGradient id="g-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B333D"/><stop offset="1" stop-color="#1B2128"/></linearGradient>
    <linearGradient id="g-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0D11"/><stop offset="1" stop-color="#161C24"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Front System Diagnostic</h1>
      <p id="subtitle" data-t="app_subtitle"></p>
    </div>
    <nav class="tabs" aria-label="Pages">
      <button data-tab="overview"><span class="ico"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span data-t="tab_overview"></span></span><span class="txt" data-t="tab_overview"></span></button>
      <button data-tab="errors"><span class="ico"><svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg><span data-t="tab_errors"></span></span><span class="txt" data-t="tab_errors"></span><span class="badge" id="badge" hidden></span></button>
      <button data-tab="registers"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg><span data-t="tab_registers"></span></span><span class="txt" data-t="tab_registers"></span></button>
      <button data-tab="settings"><span class="ico"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg><span data-t="tab_settings"></span></span><span class="txt" data-t="tab_settings"></span></button>
    </nav>
    <button class="pill" id="pill"><span class="dot"></span><span id="pill-text"></span></button>
  </header>

  <main>
    <!-- OVERVIEW -->
    <section class="page" id="page-overview">
      <div class="card full" id="connect-card">
        <div class="card-head"><span class="label" data-t="card_connection"></span></div>
        <div id="connect-body"></div>
      </div>
      <div class="banner full" id="banner" hidden>
        <div class="card-head"><span class="label" id="banner-title"></span><a id="banner-all" data-t="action_all_errors"></a></div>
        <div id="banner-list"></div>
      </div>
      <div class="grid" id="grid">
        <div class="card">
          <div class="card-head"><span class="label" data-t="card_pressure"></span><span class="state" id="p-state"></span></div>
          <svg class="drawing gauge" id="gauge" viewBox="0 0 300 192" role="img" aria-label="Pfront">
            <path class="track" fill="none" stroke-width="16" stroke-linecap="round" id="g-track"/>
            <path class="band" fill="none" stroke-width="16" id="g-band"/>
            <g id="g-ticks"></g>
            <path class="value" fill="none" stroke-width="7" stroke-linecap="round" id="g-value"/>
            <line class="target" id="g-target"/>
            <circle class="marker" r="7" id="g-marker"/>
            <text class="num" x="150" y="128" text-anchor="middle" id="g-num">0</text>
            <text class="unit" x="150" y="150" text-anchor="middle">mbar</text>
          </svg>
          <div class="metrics">
            <div class="metric"><span class="label">Pideal</span><b id="m-pideal">—</b></div>
            <div class="metric"><span class="label" data-t="datasheet"></span><b id="m-sheet">—</b></div>
            <div class="metric"><span class="label" data-t="allowed"></span><b>−5 / +12</b></div>
          </div>
          <div class="chips"><span class="chip" data-sig="INFLATE" data-c="ok">INFLATE</span><span class="chip" data-sig="DEFLATE" data-c="bad">DEFLATE</span><span class="chip" data-sig="FCE">FCE</span></div>
        </div>

        <div class="card">
          <div class="card-head"><span class="label" data-t="card_door"></span><span class="state" id="door-state"></span></div>

<script>
// Front System Diagnostic – core logic (protocol, links, diagnostics).
// Port of the Android app (V6), which itself follows advanced.cpp of V1–V5.
"use strict";

const now = () => performance.now();

/* ---------- register layout (documentation/registers.xlsx) ---------- */
// index 0 = bit 1 (value 128) … index 7 = bit 8 (value 1); null = unused bit
const RM = {
  pollOrder: ["DR0", "DR1", "DAW10", "DEW0", "DEW1", "DEW2", "DEW11", "DAW0", "DAW1"],
  analog: new Set(["DR0", "DR1"]),
  bits: {
    DAW0: [null, "BOOST", null, "NORM", "OPENING", "CLOSING", "ENALED", "PUSH"],
    DAW1: [null, null, "DEFSEAL", null, "DEFLATE", "DIAPH", "INFSEAL", "INFLATE"],
    DAW10: ["BSTLAMP", "NCF", "NFD", "NPD", "POK", "NFLD", "NSF", "FDL"],
    DEW0: ["FCE", null, "CLOSED", "LFTOUT", "ACTBST", "KEYOPEN", "RHTIN", "LFTIN"],
    DEW1: [null, "LFTWHT", "LOWTEMP", "KEYCLOSE", "ACTNORM", "KEYACT", null, "RHTOUT"],
    DEW2: [null, "RHTRED", null, "TOPWHT", "LFTRED", "RHTWHT", null, null],
    DEW11: [null, null, "NTC", null, "PREPARE", "NTNC", "NFOT", "NBOT"],
  },
  isSet: (value, index) => ((value >> (7 - index)) & 1) === 1,
  decode(register, value) {
    const out = {};
    (RM.bits[register] || []).forEach((name, i) => { if (name) out[name] = RM.isSet(value, i); });
    return out;
  },
  encode(register, signals) {
    let value = 0;
    (RM.bits[register] || []).forEach((name, i) => { if (name && signals[name]) value |= 1 << (7 - i); });
    return value;
  },
};

/* ---------- frames: the PLC ends every answer with DC1 (0x11) ---------- */
class FrameParser {
  constructor() { this.buf = ""; }
  reset() { this.buf = ""; }
  feed(bytes) {
    for (let i = 0; i < bytes.length; i++) this.buf += String.fromCharCode(bytes[i]);
    const frames = [];
    let end;
    while ((end = this.buf.indexOf("\x11")) >= 0) {
      const raw = this.buf.slice(0, end);
      this.buf = this.buf.slice(end + 1);
      const frame = FrameParser.parse(raw);
      if (frame) frames.push(frame);
    }
    if (this.buf.length > 4096) this.buf = "";
    return frames;
  }
  static parse(raw) {
    const text = raw.trim();
    if (text.replace(/[> ]/g, "") === "") return null;
    const id = text.indexOf("FPC-");
    if (id >= 0) return { type: "id", name: text.slice(id).split(/\r?\n/)[0].trim() };
    if (text.includes("SYNTAX ERROR")) return { type: "syntax" };
    const m = text.match(/([A-Z]{2,4}\d{1,2})\s*=\s*(\d{1,3})/);
    if (m && +m[2] <= 255) return { type: "reg", name: m[1], value: +m[2] };
    return { type: "unknown", raw: text };
  }
}

/* ---------- protocol: init, polling, manual commands, timeouts ----------
   Event driven: the next command goes out the moment an answer arrives. */
class PlcConnection {
  constructor(handlers) {
    this.h = handlers; // onRegister(name, value), onStatus(status), onTerminal({out, text})
    this.status = { state: "off", linkName: "", plcName: "", problem: null, detail: "", rt: 0, fps: 0 };
    this.session = 0;
    this.link = null;
    this.closing = Promise.resolve();
    this.parser = new FrameParser();
    this.timer = null;
  }

  setStatus(patch) {
    Object.assign(this.status, patch);
    this.h.onStatus({ ...this.status });
  }

  async connect(link, timeoutMs) {
    this.closeLink();
    const session = ++this.session;
    this.timeoutMs = timeoutMs;
    this.parser.reset();
    this.poll = 0;
    this.manual = [];
    this.waitingFor = null;
    this.outstanding = false;
    this.rts = [];
    this.rtCount = 0;
    this.frames = 0;
    this.setStatus({ state: "opening", linkName: link.name, plcName: "", problem: null, detail: "", rt: 0, fps: 0 });
    try {
      await this.closing;
      await link.open(
        (bytes) => { if (session === this.session) this.onBytes(bytes); },
        (message) => { if (session === this.session) this.lost("lost", message); },
      );
    } catch (e) {
      try { link.close(); } catch (_) { /* already closed */ }
      if (session === this.session) this.setStatus({ state: "off", problem: "open", detail: (e && e.message) || String(e) });
      return;
    }
    if (session !== this.session) { link.close(); return; }
    this.link = link;
    const t = now();
    this.lastRx = t;
    this.statsSince = t;
    this.setStatus({ state: "waiting" });
    this.sendInit();
    this.timer = setInterval(() => { if (session === this.session) this.tick(); }, 50);
  }

  disconnect() {
    this.closeLink();
    this.session++;
    this.setStatus({ state: "off", problem: null, detail: "", fps: 0 });
  }

  /** One command between the polling; the answer goes to the terminal. */
  send(command) {
    const cmd = command.trim().toUpperCase();
    if (!cmd) return;
    if (!this.link) { this.h.onTerminal({ out: false, text: "—" }); return; }
    this.manual.push(cmd);
    if (!this.outstanding) this.sendNext();
  }

  onBytes(bytes) {
    const t = now();
    this.lastRx = t;
    const frames = this.parser.feed(bytes);
    if (!frames.length) return;
    if (this.outstanding) this.recordRt(t - this.sentAt);
    frames.forEach((f) => this.handle(f));
    this.outstanding = false;
    this.sendNext();
  }

  handle(f) {
    switch (f.type) {
      case "id":
        if (this.status.plcName !== f.name) this.h.onTerminal({ out: false, text: f.name });
        this.setStatus({ state: "on", plcName: f.name, problem: null, detail: "" });
        break;
      case "reg":
        if (this.status.state !== "on") this.setStatus({ state: "on", problem: null, detail: "" });
        this.frames++;
        this.h.onRegister(f.name, f.value);
        if (this.waitingFor === f.name) {
          this.h.onTerminal({ out: false, text: `${f.name} = ${f.value}` });
          this.waitingFor = null;
        }
        break;
      case "syntax":
        this.h.onTerminal({ out: false, text: "E1: SYNTAX ERROR" + (this.waitingFor ? ` (${this.waitingFor})` : "") });
        this.waitingFor = null;
        break;
      default:
        this.h.onTerminal({ out: false, text: f.raw });
    }
  }

  sendNext() {
    if (!this.link) return;
    let cmd = this.manual.shift();
    if (cmd) {
      this.waitingFor = cmd;
      this.h.onTerminal({ out: true, text: cmd });
    } else {
      cmd = RM.pollOrder[this.poll];
      this.poll = (this.poll + 1) % RM.pollOrder.length;
    }
    this.write(cmd + "\r\n");
    this.outstanding = true;
    this.sentAt = now();
  }

  sendInit() {
    this.parser.reset();
    this.lastInit = now();
    this.write("\x14\r");
    this.outstanding = true;
    this.sentAt = this.lastInit;
  }

  tick() {
    if (!this.link) return;
    const t = now();
    const silent = t - this.lastRx;
    if (silent > this.timeoutMs) { this.lost("timeout", ""); return; }
    if (silent > 1000) {
      // PLC stopped answering: re-initialise every 500 ms (same as V1–V5)
      if (this.status.state === "on") this.setStatus({ state: "retry" });
      if (t - this.lastInit >= 500) this.sendInit();
      return;
    }
    if (this.status.state === "on" && this.outstanding && t - this.sentAt > 250) {
      // an answer got lost: carry on with the next register
      this.outstanding = false;
      this.sendNext();
    }
    if (t - this.statsSince >= 1000) {
      const fps = Math.round((this.frames * 1000) / (t - this.statsSince));
      this.frames = 0;
      this.statsSince = t;
      const n = Math.min(this.rtCount, 9);
      const rt = n ? Math.round(this.rts.slice(0, n).reduce((a, b) => a + b, 0) / n) : 0;
      this.setStatus({ fps, rt });
    }
  }

  recordRt(ms) {
    this.rts[this.rtCount % 9] = ms;
    this.rtCount++;
  }

  write(text) {
    const bytes = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i) & 255;
    const session = this.session;
    try {
      const p = this.link.write(bytes);
      if (p && p.catch) p.catch((e) => { if (session === this.session) this.lost("lost", (e && e.message) || String(e)); });
    } catch (e) {
      this.lost("lost", (e && e.message) || String(e));
    }
  }

  lost(problem, detail) {
    if (!this.link) return;
    this.closeLink();
    this.session++;
    this.setStatus({ state: "off", problem, detail, fps: 0 });
  }

  closeLink() {
    clearInterval(this.timer);
    this.timer = null;
    if (this.link) {
      const link = this.link;
      this.closing = Promise.resolve().then(() => link.close()).catch(() => {});
    }
    this.link = null;
    this.outstanding = false;
    this.waitingFor = null;
  }
}

/* ---------- demo PLC: a simulated train for trying the app ----------
   36 s cycle: head of train (Pideal 50) → coupled (20) → end of train (20),
   with a failing left red lamp near the end (error 23). */
class DemoPlc {
  constructor() { this.name = "Demo PLC"; }
  open(onData) {
    this.onData = onData;
    this.start = now();
    this.lastP = this.start;
    this.pressure = 0;
    this.open_ = true;
    return Promise.resolve();
  }
  write(bytes) {
    if (!this.open_) throw new Error("closed");
    const cmd = String.fromCharCode(...bytes);
    setTimeout(() => this.answer(cmd), 12 + Math.random() * 6);
  }
  close() { this.open_ = false; }
  answer(cmd) {
    if (!this.open_) return;
    let text;
    if (cmd.includes("\x14")) text = "\r\nFPC-DEMO 96\r\n>";
    else {
      const reg = cmd.trim();
      const v = this.value(reg);
      text = v === null ? "\r\nE1: SYNTAX ERROR\r\n>" : `${reg}=${v}\r\n>`;
    }
    text += "\x11";
    const out = new Uint8Array(text.length);
    for (let i = 0; i < text.length; i++) out[i] = text.charCodeAt(i);
    this.onData(out);
  }
  value(reg) {
    const t = now();
    const second = Math.floor((t - this.start) / 1000) % 36;
    const scenario = Math.floor(second / 12);
    const pideal = scenario === 0 ? 50 : 20;
    const step = Math.min(Math.abs(pideal - this.pressure), (8 * (t - this.lastP)) / 1000);
    this.lastP = t;
    this.pressure += this.pressure < pideal ? step : -step;
    const fault = scenario === 2 && second >= 29 && second <= 33;
    const s = {
      INFLATE: this.pressure < pideal - 1, DEFLATE: this.pressure > pideal + 1, FCE: true,
      ACTNORM: true, NORM: true, CLOSED: true, LFTIN: true, RHTIN: true, ENALED: true, POK: true,
      NFLD: !fault, NCF: true, NSF: true, NPD: true, NFD: true, FDL: true,
    };
    if (scenario === 0) Object.assign(s, { TOPWHT: true, LFTWHT: true, RHTWHT: true, NTC: true, NBOT: true });
    else if (scenario === 1) Object.assign(s, { NTNC: true, NFOT: true, NBOT: true });
    else Object.assign(s, { LFTRED: !fault, RHTRED: true, NTC: true, NFOT: true });
    if (reg === "DR0") return Math.floor(this.pressure);
    if (reg === "DR1") return pideal;
    if (RM.bits[reg]) return RM.encode(reg, s);
    return null;
  }
}

/* ---------- Web Serial (Chrome/Edge on a PC) ---------- */
class WebSerialLink {
  constructor(port) {
    this.port = port;
    const info = port.getInfo ? port.getInfo() : {};
    this.name = info.usbVendorId === 0x067b ? "Prolific PL2303" : "USB-serial";
  }
  async open(onData, onError) {
    await this.port.open({ baudRate: BAUD_RATE, dataBits: 8, stopBits: 1, parity: "none", flowControl: "none" });
    this.closed = false;
    this.writer = this.port.writable.getWriter();
    this.loop(onData, onError);
  }
  async loop(onData, onError) {
    while (!this.closed && this.port.readable) {
      this.reader = this.port.readable.getReader();
      try {
        for (;;) {
          const { value, done } = await this.reader.read();
          if (done) break;
          if (value && value.length) onData(value);
        }
      } catch (e) {
        if (!this.closed) { onError((e && e.message) || String(e)); return; }
      } finally {
        try { this.reader.releaseLock(); } catch (_) { /* released */ }
      }
    }
  }
  write(bytes) { return this.writer.write(bytes); }
  async close() {
    this.closed = true;
    try { if (this.reader) await this.reader.cancel(); } catch (_) { /* gone */ }
    try { if (this.writer) this.writer.releaseLock(); } catch (_) { /* gone */ }
    try { await this.port.close(); } catch (_) { /* already closed */ }
  }
}

/* ---------- WebUSB driver for Prolific PL2303 cables (Chrome on Android) ----------
   Follows the Linux driver (drivers/usb/serial/pl2303.c): the chip type is detected from the
   USB descriptor and decides the init sequence. Covers the old HX/HXD/TA/TB chips and the newer
   "HXN" family (GC/GB/GT/GL/GE/GS/GR, and the PL2303RA in e.g. the ACT AC6002 USB-C cable). */
const PROLIFIC_VID = 0x067b;
const PL2303_HXN_PIDS = new Set([0x23a3, 0x23b3, 0x23c3, 0x23d3, 0x23e3, 0x23f3]);
const BAUD_RATE = 9600;
const hex4 = (n) => n.toString(16).padStart(4, "0").toUpperCase();

class Pl2303Link {
  constructor(device) {
    this.d = device;
    this.name = device.productName || "Prolific PL2303";
    /** What happened during open(), shown on the Registers page to help when a cable does not work. */
    this.info = {
      vidPid: `${hex4(device.vendorId)}:${hex4(device.productId)}`,
      product: device.productName || "",
      maker: device.manufacturerName || "",
      bcdUsb: hex4(Pl2303Link.bcd(device.usbVersionMajor, device.usbVersionMinor, device.usbVersionSubminor)),
      bcdDevice: hex4(Pl2303Link.bcd(device.deviceVersionMajor, device.deviceVersionMinor, device.deviceVersionSubminor)),
      type: "?", steps: [], rxBytes: 0, txBytes: 0,
    };
  }

  static bcd(major, minor, sub) { return (major << 8) | (minor << 4) | sub; }

  step(text) { this.info.steps.push(text); }

  // vendor requests: 0x01 on the older chips, 0x80 (write) / 0x81 (read) on HXN
  async vendorRead(value) {
    const r = await this.d.controlTransferIn(
      { requestType: "vendor", recipient: "device", request: this.hxn ? 0x81 : 0x01, value, index: 0 }, 1);
    if (r.status !== "ok" || !r.data || r.data.byteLength < 1) throw new Error(`vendor read ${hex4(value)} failed`);
    return r.data.getUint8(0);
  }
  async vendorWrite(value, index) {
    const r = await this.d.controlTransferOut(
      { requestType: "vendor", recipient: "device", request: this.hxn ? 0x80 : 0x01, value, index });
    if (r.status !== "ok") throw new Error(`vendor write ${hex4(value)} failed`);
  }
  async updateReg(reg, mask, val) {
    const cur = await this.vendorRead(this.hxn ? reg : reg | 0x80);
    await this.vendorWrite(reg, (cur & ~mask) | (val & mask));
  }

  /** Same probe as pl2303_supports_hx_status(): only the older chips answer this read. */
  async supportsHxStatus() {
    try {
      const r = await this.d.controlTransferIn(
        { requestType: "vendor", recipient: "device", request: 0x01, value: 0x8080, index: 0 }, 1);
      return r.status === "ok" && r.data && r.data.byteLength === 1;
    } catch (_) { return false; }
  }

  /** pl2303_detect_type(); bMaxPacketSize0 is not visible in WebUSB, the old PL2303H is assumed absent. */
  async detectType() {
    const d = this.d;
    if (d.deviceClass === 0x02) return "H";
    if (PL2303_HXN_PIDS.has(d.productId)) return "HXN";
    const bcdUsb = parseInt(this.info.bcdUsb, 16);
    const bcdDevice = parseInt(this.info.bcdDevice, 16);
    if (bcdUsb === 0x101 || bcdUsb === 0x110) return bcdDevice === 0x400 ? "HXD" : "HX";
    switch (bcdDevice) {
      case 0x300: return (await this.supportsHxStatus()) ? "TA" : "HXN";
      case 0x500: return (await this.supportsHxStatus()) ? "TB" : "HXN";
      case 0x100: case 0x105: case 0x305: case 0x400: case 0x405: case 0x505: case 0x600:
      case 0x605: case 0x700: case 0x705: case 0x905: case 0x1005:
        return "HXN";
    }
    // unknown revision: let the chip tell which request set it understands
    return (await this.supportsHxStatus()) ? "HX" : "HXN";
  }

  async open(onData, onError) {
    const d = this.d;
    await d.open();
    this.step("USB open");
    if (d.configuration === null) await d.selectConfiguration(1);
    const iface = d.configuration.interfaces[0];
    await d.claimInterface(iface.interfaceNumber);
    this.ifn = iface.interfaceNumber;
    this.step(`interface ${this.ifn} claimed`);
    const eps = iface.alternate.endpoints;
    const bulkIn = eps.find((e) => e.type === "bulk" && e.direction === "in");
    const bulkOut = eps.find((e) => e.type === "bulk" && e.direction === "out");
    if (!bulkIn || !bulkOut) throw new Error("no bulk endpoints: this is not a PL2303 serial cable");
    this.inEp = bulkIn.endpointNumber;
    this.outEp = bulkOut.endpointNumber;
    this.packet = bulkIn.packetSize || 64;

    const type = await this.detectType();
    this.info.type = type;
    this.hxn = type === "HXN";
    this.step(`chip type ${type}`);

    if (this.hxn) {
      // reset the up- and downstream data pipes
      await this.vendorWrite(0x07, 0x03);
    } else {
      // init sequence of the older chips ("black magic" in usb-serial-for-android); reads may fail
      const read = (v) => this.vendorRead(v).catch(() => 0);
      await read(0x8484); await this.vendorWrite(0x0404, 0);
      await read(0x8484); await read(0x8383);
      await read(0x8484); await this.vendorWrite(0x0404, 1);
      await read(0x8484); await read(0x8383);
      await this.vendorWrite(0, 1); await this.vendorWrite(1, 0);
      await this.vendorWrite(2, type === "H" ? 0x24 : 0x44);
      await this.vendorWrite(8, 0); await this.vendorWrite(9, 0);
    }
    this.step("init done");

    // SET_LINE_CODING: 9600 baud, 1 stop bit, no parity, 8 data bits
    const line = new Uint8Array([BAUD_RATE & 255, (BAUD_RATE >> 8) & 255, (BAUD_RATE >> 16) & 255, BAUD_RATE >>> 24, 0, 0, 8]);
    const lr = await d.controlTransferOut({ requestType: "class", recipient: "interface", request: 0x20, value: 0, index: this.ifn }, line);
    if (lr.status !== "ok") throw new Error("setting 9600 8N1 failed");
    // SET_CONTROL_LINE_STATE: DTR + RTS
    await d.controlTransferOut({ requestType: "class", recipient: "interface", request: 0x22, value: 0x03, index: this.ifn });
    // no flow control
    try {
      if (this.hxn) await this.updateReg(0x0a, 0x1c, 0x1c);
      else await this.updateReg(0, 0xf0, 0);
    } catch (e) { this.step("flow control: " + e.message); }
    this.step(`line ${BAUD_RATE} 8N1, DTR+RTS`);

    this.closed = false;
    (async () => {
      while (!this.closed) {
        try {
          const r = await d.transferIn(this.inEp, this.packet);
          if (r.status === "stall") { await d.clearHalt("in", this.inEp); continue; }
          if (r.data && r.data.byteLength) {
            this.info.rxBytes += r.data.byteLength;
            onData(new Uint8Array(r.data.buffer, r.data.byteOffset, r.data.byteLength));
          }
        } catch (e) {
          if (!this.closed) { this.step("read: " + ((e && e.message) || e)); onError((e && e.message) || String(e)); }
          return;
        }
      }
    })();
  }

  async write(bytes) {
    const r = await this.d.transferOut(this.outEp, bytes);
    if (r.status === "stall") { await this.d.clearHalt("out", this.outEp); throw new Error("write stalled"); }
    this.info.txBytes += r.bytesWritten || 0;
  }

  async close() {
    this.closed = true;
    try { await this.d.releaseInterface(this.ifn); } catch (_) { /* gone */ }
    try { await this.d.close(); } catch (_) { /* gone */ }
  }
}

/* ---------- diagnostics: the rules of V1–V5 (advanced.cpp calc… functions) ----------
   An error is valid once present for errorDelayMs; status lamp errors (80–84) get 6 s extra. */
const ERROR_CODES = [11, 12, 13, 21, 22, 23, 24, 25, 26, 31, 41, 51, 61, 62, 71, 72, 73, 74, 81, 82, 83, 84];

class Diagnostics {
  constructor(clock = now, wallClock = Date.now) {
    this.clock = clock;
    this.wallClock = wallClock;
    this.errorDelayMs = 1500;
    this.pressureTimeoutS = 105;
    this.history = [];
    this.nextId = 1;
    this.reset();
  }
  reset() {
    this.values = {};
    this.signals = {};
    this.leftBolt = "unknown";
    this.rightBolt = "unknown";
    this.outOfRangeSince = -1;
    this.presentSince = new Map();
    this.clearActive();
  }
  clearActive() {
    const codes = [...(this.active ? this.active.keys() : [])];
    codes.forEach((c) => this.closeEvent(c));
    this.active = new Map();
    this.presentSince = new Map();
    return codes;
  }
  clearHistory() { this.history = this.history.filter((e) => e.clearedAt === null); }
  /** Newest first. */
  events() { return this.history.slice().reverse(); }
  update(register, value) {
    if (this.values[register] === value) return false;
    this.values[register] = value;
    Object.assign(this.signals, RM.decode(register, value));
    return true;
  }
  evaluate() {
    const t = this.clock();
    const s = (n) => this.signals[n] === true;
    const pfront = this.values.DR0 ?? 0;
    const pideal = this.values.DR1 ?? 0;
    const complete = RM.pollOrder.every((r) => r in this.values);

    const actbst = s("ACTBST"), actnorm = s("ACTNORM");
    const heater = actnorm && !actbst ? "normal" : actbst && !actnorm ? "boost" : "off";

    const ntnc = s("NTNC"), ntc = s("NTC"), nfot = s("NFOT"), nbot = s("NBOT");
    const coupling = ntnc && !ntc && nfot && nbot ? "coupled"
      : !ntnc && ntc && nfot && !nbot ? "end"
      : !ntnc && ntc && !nfot && nbot ? "front" : "none";
    const expectedPideal = coupling === "front" ? 50 : coupling === "none" ? null : 20;

    const top = s("TOPWHT"), lw = s("LFTWHT"), rw = s("RHTWHT"), lr = s("LFTRED"), rr = s("RHTRED");
    const lights = !top && !lw && !rw && !lr && !rr ? "off"
      : !top && lw && rw && !lr && !rr ? "twoWhite"
      : top && lw && rw && !lr && !rr ? "threeWhite"
      : !top && !lw && !rw && lr && rr ? "twoRed" : "invalid";

    const keyact = s("KEYACT"), keyopen = s("KEYOPEN"), keyclose = s("KEYCLOSE");
    const key = keyact && keyopen && !keyclose ? "opening" : keyact && !keyopen && keyclose ? "closing" : "neutral";

    const lftin = s("LFTIN"), lftout = s("LFTOUT"), rhtin = s("RHTIN"), rhtout = s("RHTOUT");
    if (lftin && !lftout) this.leftBolt = "in"; else if (!lftin && lftout) this.leftBolt = "out";
    if (rhtin && !rhtout) this.rightBolt = "in"; else if (!rhtin && rhtout) this.rightBolt = "out";
    const opening = s("OPENING"), closing = s("CLOSING"), push = s("PUSH");
    const door = opening && !closing && !push ? "closed"
      : !opening && !closing && push ? "pushed"
      : !opening && closing && !push ? "closed"
      : this.leftBolt === "out" && this.rightBolt === "out" ? "unlocked"
      : this.leftBolt === "in" && this.rightBolt === "in" ? "closed" : "half";

    const inRange = !(pfront <= pideal - 5 || pfront >= pideal + 12);
    if (inRange) this.outOfRangeSince = -1; else if (this.outOfRangeSince < 0) this.outOfRangeSince = t;

    const state = {
      registers: { ...this.values }, signals: { ...this.signals }, pfront, pideal, pressureInRange: inRange,
      coupling, expectedPideal, heater, lights, key, door, leftBolt: this.leftBolt, rightBolt: this.rightBolt, complete,
    };
    if (!complete) return { state, active: [...this.active.values()], raised: [], cleared: [] };

    const found = new Map();
    const b = (v) => (v ? 1 : 0);
    if (expectedPideal !== null && pideal !== expectedPideal) found.set(11, [pideal, expectedPideal]);
    if (this.outOfRangeSince >= 0 && t - this.outOfRangeSince >= this.pressureTimeoutS * 1000) found.set(12, [pfront, pideal, this.pressureTimeoutS]);
    if (s("INFLATE") && s("DEFLATE")) found.set(13, []);
    if (lights === "invalid") {
      const codes = [];
      if (!lw && rw) codes.push(21);
      if (lw && !rw) codes.push(22);
      if (!lr && rr) codes.push(23);
      if (lr && !rr) codes.push(24);
      if (top && !lw && !rw) codes.push(25);
      // V1–V5 reported "Error 20" (only a group title) when no single rule matched; that is 26 here
      if (codes.length === 1) found.set(codes[0], []);
      else found.set(26, [b(lw), b(rw), b(top), b(lr), b(rr)]);
    }
    if (actbst && actnorm) found.set(31, []);
    if (ntnc && ntc) found.set(41, []);
    if (s("INFSEAL") && s("DEFSEAL")) found.set(51, []);
    if (!keyact && (keyopen || keyclose)) found.set(61, []);
    if (keyopen && keyclose) found.set(62, []);
    const bolts = [b(lftin), b(lftout), b(rhtin), b(rhtout)];
    if (lftin && lftout) found.set(rhtin ? 71 : 72, bolts);
    if (rhtin && rhtout) found.set(lftin ? 73 : 74, bolts);
    const fdlExp = (lftin && rhtin) || coupling === "coupled";
    if (fdlExp !== s("FDL")) found.set(81, [b(s("FDL")), b(fdlExp)]);
    const nsfExp = !(lftin && lftout) && !(rhtin && rhtout);
    if (nsfExp !== s("NSF")) found.set(82, [b(s("NSF")), b(nsfExp)]);
    const nfldExp = lights !== "invalid";
    if (nfldExp !== s("NFLD")) found.set(83, [b(s("NFLD")), b(nfldExp)]);
    const ncfExp = coupling !== "none";
    if (ncfExp !== s("NCF")) found.set(84, [b(s("NCF")), b(ncfExp)]);

    const raised = [], cleared = [];
    for (const [code, args] of found) {
      if (!this.presentSince.has(code)) this.presentSince.set(code, t);
      const existing = this.active.get(code);
      if (existing) {
        if (existing.args.join() !== args.join()) this.active.set(code, { ...existing, args });
      } else if (t - this.presentSince.get(code) >= this.delayFor(code)) {
        const error = { code, args, since: this.wallClock() };
        this.active.set(code, error);
        raised.push(error);
        this.history.push({ id: this.nextId++, code, args, raisedAt: error.since, clearedAt: null });
        if (this.history.length > 300) this.history.shift();
      }
    }
    for (const code of [...this.presentSince.keys()]) if (!found.has(code)) this.presentSince.delete(code);
    for (const code of [...this.active.keys()]) {
      if (!found.has(code)) {
        this.active.delete(code);
        this.closeEvent(code);
        cleared.push(code);
      }
    }
    return { state, active: [...this.active.values()], raised, cleared };
  }
  delayFor(code) {
    if (code === 12) return 0; // has its own timeout (pressureTimeoutS)
    return code >= 80 ? this.errorDelayMs + 6000 : this.errorDelayMs;
  }
  closeEvent(code) {
    for (let i = this.history.length - 1; i >= 0; i--) {
      if (this.history[i].code === code && this.history[i].clearedAt === null) {
        this.history[i] = { ...this.history[i], clearedAt: this.wallClock() };
        return;
      }
    }
  }
}

/* ---------- self tests (same cases as the Android unit tests) ---------- */
function fsdSelfTest() {
  const results = [];
  const check = (name, ok) => results.push((ok ? "PASS " : "FAIL ") + name);
  const head = () => ({
    TOPWHT: true, LFTWHT: true, RHTWHT: true, NTC: true, NBOT: true, ACTNORM: true, NORM: true, CLOSED: true,
    LFTIN: true, RHTIN: true, ENALED: true, POK: true, FCE: true, NFLD: true, NCF: true, NSF: true, NPD: true, NFD: true, FDL: true,
  });
  const make = () => {
    const c = { t: 0 };
    const d = new Diagnostics(() => c.t, () => 1e12 + c.t);
    d.feed = (sig, pf = 50, pi = 50) => { d.update("DR0", pf); d.update("DR1", pi); Object.keys(RM.bits).forEach((r) => d.update(r, RM.encode(r, sig))); };
    return [d, c];
  };
  const codes = (d) => d.evaluate().active.map((e) => e.code).join();

  const p = new FrameParser();
  const enc = (s) => Uint8Array.from(s, (ch) => ch.charCodeAt(0));
  const f = p.feed(enc("DR0=45\r\n>\x11DEW0=37\r\n>\x11"));
  check("parser: two answers in one chunk", f.length === 2 && f[1].name === "DEW0" && f[1].value === 37);
  check("parser: identity", p.feed(enc("\r\nFPC-DEMO 96\r\n>\x11"))[0].name === "FPC-DEMO 96");
  const dew0 = RM.decode("DEW0", 37);
  check("bits: DEW0=37 is CLOSED, KEYOPEN, LFTIN", dew0.CLOSED && dew0.KEYOPEN && dew0.LFTIN && !dew0.FCE && RM.encode("DEW0", dew0) === 37);

  let [d, c] = make();
  d.feed(head());
  let r = d.evaluate();
  c.t += 20000;
  check("healthy head of train", r.state.coupling === "front" && r.state.lights === "threeWhite" && r.state.door === "closed" && codes(d) === "");

  [d, c] = make();
  d.feed(head()); d.evaluate();
  d.feed({ ...head(), LFTWHT: false, NFLD: false });
  const before = codes(d);
  c.t += 1600;
  const after = codes(d);
  d.feed(head());
  r = d.evaluate();
  check("lamp fault: error 21 after 1.5 s and cleared again", before === "" && after === "21" && r.cleared.join() === "21" && d.events()[0].clearedAt !== null);

  [d, c] = make();
  d.feed({ ...head(), NCF: false }); d.evaluate();
  c.t += 2000; const early = codes(d);
  c.t += 6000;
  check("status lamp errors wait 6 s longer", early === "" && codes(d) === "84");

  [d, c] = make();
  d.feed(head(), 30, 30); d.evaluate(); c.t += 2000;
  check("wrong Pideal is error 11", d.evaluate().active.find((e) => e.code === 11).args.join() === "30,50");

  [d, c] = make();
  d.pressureTimeoutS = 10;
  d.feed(head(), 20, 50); d.evaluate(); c.t += 9000; const e1 = codes(d); c.t += 1500;
  check("pressure error only after the timeout", !e1.includes("12") && codes(d).includes("12"));

  [d, c] = make();
  d.feed({ ...head(), LFTOUT: true, NSF: false }); d.evaluate(); c.t += 2000;
  check("bolt in and out at once is 71", codes(d) === "71");

  [d, c] = make();
  d.update("DEW2", 0); d.evaluate(); c.t += 20000;
  check("nothing before all registers arrived", codes(d) === "");
  return results;
}

const ERROR_FILES = {"Error 10":"--ENG--\r\nThese are the front rubber pressure related errors.\r\n--NL--\r\nDit zijn de fouten gerelateerde aan de voorste drukband.\r\n--FR--\r\nCe sont les erreurs liées à la pression du caoutchouc avant.","Error 11":"--ENG--\r\nError 11:\r\nPideal is a predetermined value that is based on the current connection state of the train. The train will inflate or deflate the rubber front to reach this value as close as possible. This error occurs when the value Pideal that the PLC sends does not match the expected Pideal of the datasheet.\r\nThe following values are given in the datasheet:\r\n• Front of train -> Pideal = 50mbar\r\n• Train connected -> Pideal = 20mbar \r\n• End of train -> Pideal = 20mbar \r\n• Park -> Pideal = 10mbar\r\n\r\nThis error can occur when:\r\n• The connection state of the train is wrong (this can be a train or PLC fault)\r\n• The PLC returns the wrong Pideal value (this is a PLC fault)\r\n--NL--\r\nFout 11:\r\nPideal is een vooraf bepaalde waarde die is gebaseerd op de huidige koppelstatus van de trein. De trein zal het rubberen front opblazen of laten leeglopen om naar deze waarde te streven. Deze fout treedt op wanneer de waarde Pideal die de PLC stuurt niet overeenkomt met de verwachte Pideal van de datasheet. \r\nDe volgende waarden staan in de datasheet:\r\n• Voorkant trein -> Pideal = 50mbar\r\n• Trein aangesloten -> Pideal = 20mbar\r\n• Einde trein -> Pideal = 20mbar\r\n• Parkeren ->  Pideal = 10mbar\r\n\r\nDeze fout kan optreden wanneer:\r\n• De koppelstatus van de trein verkeerd is (dit kan een trein- of PLC-fout zijn)\r\n• De PLC geeft de verkeerde Pideal-waarde terug (dit is een PLC-fout)\r\n--FR--\r\nErreur 11:\r\nPideal est une valeur prédéterminée basée sur l'état de couplage actuel du train. Le train va gonfler ou dégonfler le caoutchouc avant pour obtenire cette valeur. Cette erreur se produit lorsque la valeur Pideal envoyée par l'automate ne correspond avec à la valeur expecte Pideal de la fiche technique.\r\nLes valeurs suivantes sont dans la fiche technique:\r\n• Avant de train -> Pideal = 50mbar\r\n• Train connecté -> Pideal = 20mbar\r\n• Fin de train -> Pideal = 20mbar\r\n• Stationnement -> Pideal = 10 mbar\r\n\r\nCette erreur peut se reproduire lorsque:\r\n• L'état de couplage du train est incorrect (il peut s'agir d'une erreur PLC)\r\n• L'automate renvoie la mauvaise valeur Pideal (il s'agit d'une erreur PLC)","Error 12":"--ENG--\r\nError 12:\r\nPfront should rise or fall to Pideal in a given timespan if you try to inflate or deflate the rubber front. If Pfront does not reach Pideal in this timespan the rubber front pressure is incorrect.\r\nThis error can occur when:\r\n• Pideal is incorrect (check error 11).\r\n• There is a hole in the rubber.\r\n• Pfront is read incorrect (train sensor or PLC fault).\r\n\r\n* You may ignore this error when error 11 occurred.\r\n--NL--\r\nFout 12:\r\nPfront moet binnen een bepaalde tijd naar Pideal stijgen of dalen als u het rubberen front probeert te inflaten of deflaten. Als Pfront Pideal niet bereikt is in deze tijdspanne dan is de druk van de rubbere band niet correct.\r\nDeze fout kan optreden wanneer:\r\n• Pideal is incorrect (check error 11).\r\n• Er zit een gat in het rubber.\r\n• Pfront wordt niet goed uitgelezen (treinsensor of PLC storing).\r\n\r\n* U mag deze fout negeren wanneer fout 11 is opgetreden.\r\n--FR--\r\nErreur 12:\r\nla valeur du Pfront devrait monter ou descendre jusqu'à Pideal dans un laps de temps donné si vous essayez de gonfle au dégonflé. Si Pfront n'atteint pas Pideal dans ce laps de temps, la pression avant du caoutchouc est incorrecte.\r\nCette erreur peut se reproduire lorsque:\r\n• Pideal est incorrect (défaut du capteur de train ou PLC).\r\n• Il y a un trou dans le caoutchouc.\r\n• Pfront est lu incorrect (défaillance du capteur de train ou PLC).\r\n\r\n* Vous pouvez ignorer cette erreur lorsque l'erreur 11 s'est produite.","Error 13":"--ENG--\r\nError 13:\r\nThe PLC thinks you're trying to inflate and deflate the rubber front at the same time.\r\nThis error can occur when:\r\n• infseal is read incorrect (train sensor or PLC fault).\r\n• defseal is read incorrect (train sensor or PLC fault).\r\n\r\n*RBNPD (no pressure sensor defect) can tell you more about this error.\r\n--NL--\r\nFout 13:\r\nDe PLC denkt dat u tegelijkertijd de rubberen front probeert op te blazen en leeg te laten lopen.\r\nDeze fout kan optreden wanneer:\r\n• infseal wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• defseal wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n\r\n*RBNPD (geen druksensor defect) kan u meer vertellen over deze fout.\r\n--FR--\r\nErreur 13 :\r\nLe PLC pense que vous essayez de gonfler et de dégonfler le caoutchouc avant en même temps.\r\nCette erreur peut se produire lorsque :\r\n• infseal est mal lu (défaut du capteur de train ou PLC).\r\n• defseal est mal lu (défaut du capteur de train ou PLC).\r\n\r\n*RBNPD (aucun défaut de capteur de pression) peut vous en dire plus sur cette erreur.","Error 20":"--ENG--\r\nThese are the front/back light related errors.\r\n--NL--\r\nDit zijn de voor- en achterlicht gerelateerde fouten.\r\n--FR--\r\nCe sont les erreurs liées à la lumière avant/arrière.","Error 21":"--ENG--\r\nError 21:\r\nThe left front light is broken.\r\nThis error can occur when:\r\n• The left front light is broken.\r\n• The connection to the left front light is broken\r\n• LFTWHT is read incorrect (train sensor or PLC fault).\r\n• RHTWHT is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 21:\r\nHet linker voorlicht is kapot.\r\nDeze fout kan optreden wanneer:\r\n• Het linker voorlicht kapot is.\r\n• het contact met het linker voorlicht is onderbroken.\r\n• LFTWHT wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• RHTWHT wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n--FR--\r\nErreur 21:\r\nLe phare avant gauche est cassé.\r\nCette erreur peut se produire lorsque:\r\n• Le phare avant gauche est défectueux.\r\n• La connexion avec le phare avant gauche est interrompue.\r\n• LFTWHT est lu incorrect (défaut du capteur de train ou PLC).\r\n• RHTWHT est lu incorrect (défaut du capteur de train ou PLC).","Error 22":"--ENG--\r\nError 22:\r\nThe right front light is broken.\r\nThis error can occur when:\r\n• The right front light is broken.\r\n• The connection to the right front light is broken\r\n• RHTWHT is read incorrect (train sensor or PLC fault).\r\n• LFTWHT is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 22:\r\nHet rechter voorlicht is kapot.\r\nDeze fout kan optreden wanneer:\r\n• Het rechter voorlicht kapot is.\r\n• het contact met het rechter voorlicht is onderbroken.\r\n• RHTWHT wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• LFTWHT wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n--FR--\r\nErreur 22:\r\nLe phare avant droit est cassé.\r\nCette erreur peut se produire lorsque:\r\n• Le phare avant droit est défectueux.\r\n• La connexion avec le phare avant droit est interrompue\r\n• RHTWHT est lu incorrect (défaut du capteur de train ou PLC).\r\n• LFTWHT est lu incorrect (défaut du capteur de train ou PLC).","Error 23":"--ENG--\r\nError 23:\r\nThe left tail light is broken.\r\nThis error can occur when:\r\n• The left tail light is broken.\r\n• The connection to the left tail light is broken\r\n• LFTRED is read incorrect (train sensor or PLC fault).\r\n• RHTRED is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 23:\r\nHet linker achterlicht is kapot.\r\nDeze fout kan optreden wanneer:\r\n• Het linker achterlicht kapot is.\r\n• het contact met het linker achterlicht is onderbroken.\r\n• LFTRED wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• RHTRED wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n--FR--\r\nErreur 23:\r\nLe pharearrière gauche est cassé.\r\nCette erreur peut se produire lorsque:\r\n• Le phare arrière gauche est défectueux.\r\n• La connexion avec le phare arrière gauche est interrompue\r\n• LFTRED est mal lu (défaut du capteur de train ou PLC).\r\n• RHTRED est lu incorrect (défaut du capteur de train ou PLC).","Error 24":"--ENG--\r\nError 24:\r\nThe right tail light is broken.\r\nThis error can occur when:\r\n• The right tail light is broken.\r\n• The connection to the right tail light is broken\r\n• RHTRED is read incorrect (train sensor or PLC fault).\r\n• LFTRED is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 24:\r\nHet rechter achterlicht is kapot.\r\nDeze fout kan optreden wanneer:\r\n• Het rechter achterlicht is kapot.\r\n• De verbinding met het rechter achterlicht is onderbroken.\r\n• RHTRED wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• LFTRED wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n--FR--\r\nErreur 24:\r\nLe phare arrière droit est cassé.\r\nCette erreur peut se produire lorsque:\r\n• Le phare arrière droit est défectueux.\r\n• La connexion au phare arrière droit est interrompue\r\n• RHTRED est lu incorrect (défaut du capteur de train ou PLC).\r\n• LFTRED est lu incorrect (défaut du capteur de train ou PLC).","Error 25":"--ENG--\r\nError 25:\r\nOnly the top light is burning.\r\nThis error can only occur when:\r\n• TOPWHT is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 25:\r\nAlleen het bovenste licht brandt.\r\nDeze fout kan alleen optreden als:\r\n• TOPWHT wordt niet goed uitgelezen (treinsensor of PLC storing).\r\n--FR--\r\nErreur 25:\r\nSeule le phare supérieur est allumer.\r\nCette erreur ne peut se produire que lorsque:\r\n• TOPWHT est lu incorrect (défaut du capteur de train ou PLC).","Error 26":"--ENG--\r\nError 26:\r\nThis is a global lights error, meaning the configuation of lights is invalide.\r\nMeaning a front light is on while a tail lights is also on.\r\nThis error can occur when:\r\n• A light shows on that shouldn't be (train sensor or PLC fault).\r\n\r\n* If this error occurs means that there are more than 2 lights errors\r\n* Switching the lighswitch may result in an other error that gives more specific information\r\n--NL--\r\nFout 26:\r\nDit is een globale lichtfout, wat betekent dat de configuratie van de lichten ongeldig is.\r\nDit betekent dat een voorlicht aan staat terwijl een achterlicht ook aan staat.\r\nDeze fout kan optreden wanneer:\r\n• Er brandt een lamp dat uit zou moeten staan (treinsensor of PLC storing).\r\n\r\n* Als deze fout optreedt, betekent dit dat er meer dan 2 lichtfouten zijn\r\n* het omschakelen van de lichtschakelaar kan resulteren in een andere fout die meer specifieke informatie geeft\r\n--FR--\r\nErreur 26:\r\nIl s'agit d'une erreur d'éclairage globale, ce qui signifie que la configuration des lumières n'est pas valide.\r\nCela signifie qu'un feu avant est allumé alors qu'un feu arrière est également allumé.\r\nCette erreur peut se produire lorsque:\r\n• Un voyant est allumé qui devrait être éteint (défaut capteur train ou PLC).\r\n\r\n* Si cette erreur se produit, cela signifie qu'il y a plus de 2 erreurs de voyants\r\n* Basculer l'interrupteur d'éclairage peut entraîner une autre erreur donnant des informations plus spécifiques","Error 31":"--ENG--\r\nError 31:\r\nHeating switch error, this means that the switch has 2 states at the same time.\r\nMeaning ACTBST and ACTNORM is both true.\r\nThis error can occur when:\r\n• ACTBST or ACTNORM is read incorrect (train sensor or PLC fault).\r\n• The heatingswitch is broken.\r\n--NL--\r\nFout 31:\r\nStoring verwarmingsschakelaar, dit betekent dat de schakelaar 2 standen tegelijkertijd heeft.\r\nBetekenis ACTBST en ACTNORM zijn beide als true.\r\nDeze fout kan optreden wanneer:\r\n• ACTBST of ACTNORM wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• De verwarmingsschakelaar is kapot.\r\n--FR--\r\nErreur 31:\r\nErreur d'interrupteur du chauffage, cela signifie que l'interrupteur a 2 position en même temps.\r\nCela signifie que ACTBST et ACTNORM sont tous les deux vrais.\r\nCette erreur peut se produire lorsque:\r\n• ACTBST ou ACTNORM est lu incorrect (défaut du capteur de train ou PLC).\r\n• L'interrupteur du chauffage est cassé.","Error 41":"--ENG--\r\nError 41:\r\nNTNC and NTC are both in the true state, meaning the train thinks it is connected with an other train, while also signalling its not.\r\nThis error can occur when:\r\n• NTNC is read incorrect (train sensor or PLC fault).\r\n• NTC is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 41:\r\nNTNC en NTC zijn beide in de aan status, wat betekent dat de trein denkt dat hij verbonden is met een andere trein, terwijl hij ook aangeeft dat dit niet het geval is.\r\nDeze fout kan optreden wanneer:\r\n• NTNC wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• NTC wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n--FR--\r\nErreur 41:\r\nNTNC et NTC sont tous les deux dans l'état réel, ce qui signifie que le train pense qu'il est connecté à un autre train, tout en signalant qu'il ne l'est pas.\r\nCette erreur peut se produire lorsque:\r\n• NTNC est lu incorrect (défaut du capteur de train ou PLC).\r\n• NTC est lu incorrect (défaut du capteur de train ou PLC).","Error 51":"--ENG--\r\nError 51:\r\nThe PLC think your trying to inflate and deflate the seal around the door at the same time.\r\nThis error can occur when:\r\n• infseal is read incorrect (train sensor or PLC fault).\r\n• defseal is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 51:\r\nDe PLC denkt dat u tegelijkertijd de afdichting rond de deur probeert op te blazen en te laten leeglopen.\r\nDeze fout kan optreden wanneer:\r\n• infseal wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n• defseal wordt onjuist uitgelezen (treinsensor of PLC-fout).\r\n--FR--\r\nErreur 51:\r\nLe PLC pense que vous essayez de gonfler et de dégonfler le joint autour de la porte en même temps.\r\nCette erreur peut se produire lorsque:\r\n• infseal est lu incorrect (défaut du capteur de train ou PLC).\r\n• defseal est lu incorrect (défaut du capteur de train ou PLC).","Error 60":"--ENG--\r\nThese are errors related to the key slot for opening or closing the front door.\r\n--NL--\r\nDit zijn fouten die verband houden met het sleutelgat voor het openen of sluiten van de voordeur.\r\n--FR--\r\nCe sont des erreurs liées à la fente de la clé pour ouvrir ou fermer la porte d'entrée.","Error 61":"--ENG--\r\nError 61:\r\nThe PLC detect your key in in the closing or opening positioning without detecting the key. This is related to a sensor in the keyhole that is possibly malfunctioning.\r\nThis error can occur when:\r\n• Keyact is read incorrect (train sensor or PLC fault).\r\n• Closed is read incorrect (train sensor or PLC fault).\r\n• Opening is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 61:\r\nDe PLC detecteert dat de sluitings- of openingspositie geactiveerd word zonder dat een sleutel te detecteren. Dit heeft te maken met een sensor in het sleutelgat die mogelijk niet goed werkt.\r\nDeze fout kan optreden wanneer:\r\n• Keyact wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• Gesloten wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• Opening wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n--FR--\r\nErreur 61:\r\nL'automate détecte votre clé en position de fermeture ou d'ouverture sans détecter la clé. Ceci est lié à un capteur dans le trou de la serrure qui fonctionne peut-être mal.\r\nCette erreur peut se produire lorsque:\r\n• Keyact est lu incorrect (défaut du capteur de train ou PLC).\r\n• Fermé est lu incorrect (défaut du capteur de train ou PLC).\r\n• L'ouverture est lu incorrect (défaut du capteur de train ou PLC).","Error 62":"--ENG--\r\nError 62:\r\nThe PLC detects your key in the closing and opening position at the same time. This is related to a sensor in the keyhole that is possibly malfunctioning.\r\nThis error can occur when:\r\n• Closed is read incorrect (train sensor or PLC fault).\r\n• Opening is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 62:\r\nDe PLC detecteert uw sleutel tegelijkertijd in de sluit- en openingspositie. Dit heeft te maken met een sensor in het sleutelgat die mogelijk niet goed werkt.\r\nDeze fout kan optreden wanneer:\r\n• Gesloten wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• Opening wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n--FR--\r\nErreur 62:\r\nLe PLC détecte votre clé dans le positionnement de fermeture et d'ouverture en même temps. Ceci est lié à un capteur dans le trou de la serrure qui fonctionne peut-être mal.\r\nCette erreur peut se produire lorsque:\r\n• Fermé est lu incorrect (défaut du capteur de train ou PLC).\r\n• L'ouverture est lu incorrect (défaut du capteur de train ou PLC).","Error 70":"--ENG--\r\nError 70:\r\nThis is the global locking bolt error.\r\nThis error can occur when:\r\n• lftout is read incorrect (train sensor or PLC fault).\r\n• lftin is read incorrect (train sensor or PLC fault).\r\n• rhtout is read incorrect (train sensor or PLC fault).\r\n• rhtin is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 70:\r\nDit is de globale vergrendelingsboutfout.\r\nDeze fout kan optreden wanneer:\r\n• lftout wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• lftin wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• rhtout wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• rhtin wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n--FR--\r\nErreur 70:\r\nIl s'agit de l'erreur globale du boulon de verrouillage.\r\nCette erreur peut se produire lorsque:\r\n• lftout est lu incorrect (défaut du capteur de train ou PLC).\r\n• lftin est lu incorrect (défaut du capteur de train ou PLC).\r\n• rhtout est lu incorrect (défaut capteur train PLC).\r\n• rhtin est lu incorrect (défaut du capteur de train ou PLC).","Error 71":"--ENG--\r\nError 71:\r\nThe PLC detects that there is an invalid configuration of locking bolts to lock the front door. The PLC thinks the left locking bolt is in the in and out possition at the same time. \r\nIt is most likly that:\r\nlftout is read incorrectly, this is moslty a train sensor fault, but in rare ocasions this can also be a PLC fault. \r\nThis error can occur when:\r\n• lftout is read incorrect (train sensor or PLC fault).\r\n• lftin is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 71:\r\nDe PLC detecteert dat er een ongeldige configuratie is van de vergrendelingsbouten om de voordeur te vergrendelen. De PLC denkt dat de linker vergrendeling tegelijkertijd in de in- en uit-stand staat.\r\nHet is zeer waarschijnlijk dat:\r\nlftout word verkeerd uitgelezen, dit is meestal een treinsensorfout, maar in zeldzame gevallen kan dit ook een PLC-fout zijn.\r\nDeze fout kan optreden wanneer:\r\n• lftout wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• lftin wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n--FR--\r\nErreur 71:\r\nL'automate détecte qu'il existe une configuration invalide du boulon de verrouillage de la porte d'entrée. Le PLC pense que le verrouillage gauche est dans les deux position.\r\nç'est probablement ce si:\r\nlftout est mal lu, il s'agit principalement d'un défaut de capteur de train, mais dans de rares cas, il peut également s'agir d'un défaut PLC.\r\nCette erreur peut se produire lorsque:\r\n• lftout est lu incorrect (défaut du capteur de train ou PLC).\r\n• lftin est lu incorrect (défaut du capteur de train ou PLC).","Error 72":"--ENG--\r\nError 72:\r\nThe PLC detects that there is an invalide configuration of locking bolts to lock the front door. The PLC thinks the left locking bolt is in the in and out possition at the same time. \r\nIt is most likly that:\r\nlftin is read incorrectly, this is moslty a train sensor fault, but in rare ocasions this can also be a PLC fault. \r\nThis error can occur when:\r\n• lftin is read incorrect (train sensor or PLC fault).\r\n• lftout is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 72:\r\nDe PLC detecteert dat er een ongeldige configuratie is van de vergrendelingsbouten om de voordeur te vergrendelen. De PLC denkt dat de linker vergrendeling tegelijkertijd in de in- en uit-stand staat.\r\nHet is zeer waarschijnlijk dat:\r\nlftin verkeerd wordt uitgelezen, dit is meestal een treinsensorfout, maar in zeldzame gevallen kan dit ook een PLC-fout zijn.\r\nDeze fout kan optreden wanneer:\r\n• lftin wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n• lftout wordt verkeerd uitgelezen (treinsensor of PLC storing).\r\n--FR--\r\nErreur 72:\r\nLe PLC détecte qu'il existe une configuration invalide des du boulon de verrouillage pour verrouiller la porte d'entrée. Le PLC pense que le verrou de gauche est dans les deux position.\r\nIl est fort probable que:\r\nlftin est mal lu, il s'agit principalement d'un défaut de capteur de train, mais dans de rares cas, il peut également s'agir d'un défaut de l'automate.\r\nCette erreur peut se produire lorsque:\r\n• lftin est lu incorrect (défaut du capteur de train ou PLC).\r\n• lftout est lu incorrect (défaut du capteur de train ou PLC).\r\n","Error 73":"--ENG--\r\nError 73:\r\nThe PLC detects that there is an invalide configuration of locking bolts to lock the front door. The PLC thinks the right locking bolt is in the in and out possition at the same time. \r\nIt is most likly that:\r\nrhtout is read incorrectly, this is moslty a train sensor fault, but in rare ocasions this can also be a PLC fault. \r\nThis error can occur when:\r\n• rhtout is read incorrect (train sensor or PLC fault).\r\n• rhtin is read incorrect (train sensor or PLC fault).\r\n--NL--\r\nFout 73:\r\nDe PLC detecteert dat er een ongeldige configuratie is van de vergrendelingsbouten om de voordeur te vergrendelen. De PLC denkt dat de rechtse vergrendeling tegelijkertijd in de in- en uit-stand staat.\r\nHet is zeer waarschijnlijk dat:\r\nrhtout verkeerd wordt uitgelezen, dit is meestal een treinsensorfout, maar in zeldzame gevallen kan dit ook een PLC-fout zijn.\r\nDeze fout kan optreden wanneer:
