/* ---------- settings (stored per browser) ---------- */
const DEFAULTS = { autoConnect: true, plcTimeoutS: 10, pressureTimeoutS: 105, errorDelayS: 1.5, notify: true, keepScreenOn: true, lang: "" };
function loadSettings() {
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("fsd-settings") || "{}") }; } catch (_) { return { ...DEFAULTS }; }
}
function saveSettings() {
  try { localStorage.setItem("fsd-settings", JSON.stringify(S.settings)); } catch (_) { /* private mode */ }
}

const S = {
  status: { state: "off", linkName: "", plcName: "", problem: null, detail: "", rt: 0, fps: 0 },
  front: null, active: [], history: [], terminal: [], settings: loadSettings(), tab: "overview",
  blocked: false,
};
let errorsDirty = true, termDirty = true, scheduled = false, userStopped = false;

const lang = () => {
  const l = S.settings.lang || (navigator.language || "en").slice(0, 2).toLowerCase();
  return STR[l] ? l : "en";
};
function t(key, ...args) {
  let s = (STR[lang()][key] ?? STR.en[key] ?? key);
  args.forEach((a, i) => { s = s.split("%" + (i + 1)).join(a); });
  return s;
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const timeStr = (ms) => new Date(ms).toLocaleTimeString(lang());

function errorTitle(code) { return t("err_title_" + code); }
function errorDetail(code, a) {
  if (code === 11) return t("err_detail_11", a[0], a[1]);
  if (code === 12) return t("err_detail_12", a[0], a[1], a[2]);
  if (code === 26) return `LFTWHT ${a[0]} · RHTWHT ${a[1]} · TOPWHT ${a[2]} · LFTRED ${a[3]} · RHTRED ${a[4]}`;
  if (code >= 71 && code <= 74) return `LFTIN ${a[0]} · LFTOUT ${a[1]} · RHTIN ${a[2]} · RHTOUT ${a[3]}`;
  if (code >= 81) return t("err_detail_lamp", a[0], a[1]);
  return "";
}
/** Section of the V1–V5 error file in the app language. */
function explanation(code) {
  const text = ERROR_FILES["Error " + code];
  if (!text) return "";
  const section = { nl: "NL", fr: "FR" }[lang()] || "ENG";
  const lines = text.split(/\r?\n/);
  let start = lines.findIndex((l) => l.trim() === `--${section}--`);
  if (start < 0) start = lines.findIndex((l) => l.trim() === "--ENG--");
  const body = [];
  for (const l of lines.slice(start + 1)) { if (/^--[A-Z]+--$/.test(l.trim())) break; body.push(l); }
  while (body.length && !body[0].trim()) body.shift();
  if (body.length && /\d/.test(body[0]) && body[0].trim().endsWith(":")) body.shift();
  return body.join("\n").trim();
}

/* ---------- PLC wiring ---------- */
const diag = new Diagnostics();
function applySettings() {
  diag.errorDelayMs = S.settings.errorDelayS * 1000;
  diag.pressureTimeoutS = S.settings.pressureTimeoutS;
}
applySettings();

const conn = new PlcConnection({
  onRegister(name, value) { if (diag.update(name, value)) publish(diag.evaluate()); },
  onStatus(st) {
    const prev = S.status.state;
    S.status = st;
    if (st.state === "opening") { diag.reset(); publish(diag.evaluate()); }
    if (st.state === "off" && prev !== "off") { diag.clearActive(); S.active = []; S.history = diag.events(); errorsDirty = true; }
    updateWakeLock();
    schedule();
  },
  onTerminal(line) {
    S.terminal.push(line);
    if (S.terminal.length > 200) S.terminal.shift();
    termDirty = true;
    schedule();
  },
});
setInterval(() => {
  if (S.status.state !== "off" && S.status.state !== "opening") publish(diag.evaluate());
}, 250);

function publish(r) {
  S.front = r.state;
  const key = r.active.map((e) => e.code + ":" + e.args.join(",")).join(";");
  if (key !== S.activeKey) { S.activeKey = key; S.active = r.active; errorsDirty = true; }
  if (r.raised.length || r.cleared.length) { S.history = diag.events(); errorsDirty = true; }
  if (S.settings.notify) r.raised.forEach((e) => snack(t("snackbar_error", e.code, errorTitle(e.code))));
  schedule();
}

function timeoutMs() { return S.settings.plcTimeoutS * 1000; }
function startDemo() { userStopped = false; conn.connect(new DemoPlc(), timeoutMs()); }
async function startSerial(port) {
  userStopped = false;
  try {
    const p = port || await navigator.serial.requestPort();
    conn.connect(new WebSerialLink(p), timeoutMs());
  } catch (e) { usbError(e); }
}
/** WebUSB with the PL2303 driver; anyDevice shows every USB device in Chrome's list. */
async function startUsb(device, anyDevice = false) {
  userStopped = false;
  if (!window.isSecureContext) { snack(t("usb_https")); return; }
  try {
    const d = device || await navigator.usb.requestDevice({ filters: anyDevice ? [] : [{ vendorId: PROLIFIC_VID }] });
    const link = new Pl2303Link(d);
    S.usbInfo = link.info;
    conn.connect(link, timeoutMs());
  } catch (e) { usbError(e); }
}
function usbError(e) {
  if (e && e.name === "NotFoundError") return; // the user closed the picker
  if (e && (e.name === "SecurityError" || e.name === "NotAllowedError")) { S.blocked = true; snack(t("usb_blocked")); }
  else snack((e && e.message) || String(e));
  schedule();
}
/** Problem line on the connection card, with a hint for the usual USB causes. */
function problemText(st) {
  if (st.problem === "timeout") return t("problem_timeout");
  if (st.problem === "lost") return t("problem_lost", st.detail);
  if (st.problem !== "open") return "";
  if (/claim|in use|busy|access denied|unable to open/i.test(st.detail)) return t("usb_busy");
  if (/bulk endpoints/i.test(st.detail)) return t("usb_not_serial", S.usbInfo ? S.usbInfo.vidPid : "?");
  return t("problem_open", st.detail);
}
const isAndroid = /Android/i.test(navigator.userAgent) || (navigator.userAgentData && navigator.userAgentData.platform === "Android");
function stop() { userStopped = true; conn.disconnect(); }

/* automatic connect to a cable this browser was allowed to use before */
async function knownPorts() {
  const out = [];
  try { if (navigator.serial) for (const p of await navigator.serial.getPorts()) out.push({ kind: "serial", port: p, kit: p.getInfo().usbVendorId === PROLIFIC_VID }); } catch (_) { S.blocked = true; }
  try { if (navigator.usb) for (const d of await navigator.usb.getDevices()) if (d.vendorId === PROLIFIC_VID) out.push({ kind: "usb", port: d, kit: true }); } catch (_) { S.blocked = true; }
  return out;
}
async function autoConnect() {
  if (!S.settings.autoConnect || userStopped || S.status.state !== "off") return;
  const ports = await knownPorts();
  const p = ports.find((x) => x.kit) || ports[0];
  if (!p) return;
  if (p.kind === "serial") startSerial(p.port); else startUsb(p.port);
}
try { if (navigator.serial) navigator.serial.addEventListener("connect", () => autoConnect()); } catch (_) { /* blocked */ }
try { if (navigator.usb) navigator.usb.addEventListener("connect", () => autoConnect()); } catch (_) { /* blocked */ }

/* keep the screen on while connected */
let wakeLock = null;
async function updateWakeLock() {
  const want = S.settings.keepScreenOn && S.status.state !== "off" && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (_) { wakeLock = null; }
}
document.addEventListener("visibilitychange", updateWakeLock);

/* ---------- static parts ---------- */
const LAMPS = ["FDL", "NSF", "NFD", "NFLD", "NCF", "NPD"];
$("tiles").innerHTML = LAMPS.map((s) => `<div class="tile" data-fault="${s}"><svg viewBox="0 0 24 24"><g class="lamp" data-c="red" data-lamp="${s}" transform="translate(12 12)"><circle class="glow" r="12" fill="url(#g-red)"/><circle class="core" r="7.5"/></g></svg><div><b>RB${s === "FDL" ? "" : "N"}${s.replace(/^N/, "")}</b><small data-t="lamp_${s}"></small></div></div>`).join("");
$("regs").innerHTML = RM.pollOrder.map((r) => `<div><div class="reg-h"><b>${r}</b><span id="rv-${r}">—</span></div>${RM.bits[r] ? `<div class="bits">${RM.bits[r].map((n, i) => `<div class="bit${n ? "" : " unused"}" id="rb-${r}-${i}">${n || "–"}</div>`).join("")}</div>` : ""}</div>`).join("");
$("quick").innerHTML = RM.pollOrder.map((r) => `<button class="chip quick" data-cmd="${r}">${r}</button>`).join("");

// gauge geometry: 240° arc from 150° (clockwise), centre (150,126), radius 108
const G = { cx: 150, cy: 126, r: 108 };
const pt = (a, r) => { const rad = (a * Math.PI) / 180; return [G.cx + Math.cos(rad) * r, G.cy + Math.sin(rad) * r]; };
function arc(a0, a1, r = G.r) {
  if (a1 - a0 < 0.2) return "";
  const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r);
  return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
}
$("g-track").setAttribute("d", arc(150, 390));
const gauge = { shown: 0, target: 0, max: 80, maxShown: 80, pideal: 0, anim: null };
function drawGauge() {
  const ang = (v) => 150 + 240 * Math.max(0, Math.min(1, v / gauge.maxShown));
  $("g-band").setAttribute("d", arc(ang(gauge.pideal - 5), ang(gauge.pideal + 12)));
  $("g-value").setAttribute("d", arc(150, ang(gauge.shown)));
  const [mx, my] = pt(ang(gauge.shown), G.r);
  $("g-marker").setAttribute("cx", mx.toFixed(1)); $("g-marker").setAttribute("cy", my.toFixed(1));
  const ta = ang(gauge.pideal), [x0, y0] = pt(ta, G.r - 14), [x1, y1] = pt(ta, G.r + 14);
  const tl = $("g-target");
  tl.setAttribute("x1", x0.toFixed(1)); tl.setAttribute("y1", y0.toFixed(1)); tl.setAttribute("x2", x1.toFixed(1)); tl.setAttribute("y2", y1.toFixed(1));
  $("g-num").textContent = Math.round(gauge.shown);
  let ticks = "";
  for (let v = 0; v <= gauge.maxShown + 0.1; v += 10) {
    const a = ang(v), major = v % 50 === 0;
    const [ax, ay] = pt(a, G.r - (major ? 22 : 17)), [bx, by] = pt(a, G.r - 12);
    ticks += `<line class="tick${major ? " major" : ""}" x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/>`;
  }
  $("g-ticks").innerHTML = ticks;
}
function setGauge(pfront, pideal) {
  const max = Math.ceil(Math.max(80, pideal * 1.6, pfront * 1.15) / 10) * 10;
  if (pfront === gauge.target && max === gauge.max && pideal === gauge.pideal) return;
  const from = gauge.shown, fromMax = gauge.maxShown, start = performance.now();
  gauge.target = pfront; gauge.max = max; gauge.pideal = pideal;
  cancelAnimationFrame(gauge.anim);
  const step = (ts) => {
    const k = Math.min(1, (ts - start) / 300), e = 1 - Math.pow(1 - k, 3);
    gauge.shown = from + (pfront - from) * e;
    gauge.maxShown = fromMax + (max - fromMax) * e;
    drawGauge();
    if (k < 1) gauge.anim = requestAnimationFrame(step);
  };
  gauge.anim = requestAnimationFrame(step);
}
drawGauge();

/* ---------- rendering ---------- */
function schedule() { if (!scheduled) { scheduled = true; requestAnimationFrame(render); } }
const sigEls = [...document.querySelectorAll("[data-sig]")];

function render() {
  scheduled = false;
  renderHeader();
  if (S.tab === "overview") renderOverview();
  if (S.tab === "errors" && errorsDirty) { renderErrors(); errorsDirty = false; }
  if (S.tab === "registers") renderRegisters();
  const n = S.active.length;
  $("badge").hidden = n === 0;
  $("badge").textContent = n;
}

function renderHeader() {
  const st = S.status;
  const busy = st.state === "opening" || st.state === "waiting" || st.state === "retry";
  const pill = $("pill");
  const color = st.state === "on" ? "var(--ok)" : busy ? "var(--amber)" : st.problem ? "var(--bad)" : "var(--muted)";
  pill.style.setProperty("--pc", color);
  pill.classList.toggle("busy", busy);
  $("pill-text").textContent = st.state === "on" ? (st.rt ? st.rt + " ms" : t("state_connected"))
    : busy ? t(st.state === "retry" ? "state_reconnecting" : "state_connecting") : t("state_disconnected");
  $("subtitle").textContent = st.state === "on" && st.plcName ? `${st.plcName} · ${st.linkName}` : t("app_subtitle");
}

function renderOverview() {
  const st = S.status, f = S.front || { signals: {}, pfront: 0, pideal: 0, complete: false, pressureInRange: true, expectedPideal: null, lights: "off", coupling: "none", key: "neutral", heater: "off", door: "closed", leftBolt: "unknown", rightBolt: "unknown" };
  const live = st.state === "on";
  $("page-overview").classList.toggle("dim", !live);

  // connection card
  $("connect-card").hidden = live;
  if (!live) {
    const busy = st.state !== "off";
    const key = busy + "|" + st.state + "|" + st.problem + "|" + st.detail + "|" + lang() + "|" + S.blocked;
    if (key !== renderOverview.connKey) {
      renderOverview.connKey = key;
      let html = "";
      if (busy) {
        html = `<b>${esc(t(st.state === "retry" ? "state_reconnecting_long" : "state_connecting_long", st.linkName))}</b><div class="progress"></div><div class="btns"><button class="btn" data-act="stop">${t("action_cancel")}</button></div>`;
      } else {
        const problem = problemText(st);
        const can = !!(navigator.serial || navigator.usb);
        // on a phone "Connect" opens Chrome's USB list straight away (WebUSB); on a PC the choice of port
        const direct = isAndroid && navigator.usb;
        const hint = !can ? t("no_usb") : S.blocked ? t("usb_blocked") : !window.isSecureContext ? t("usb_https") : t(direct ? "hint_cable_android" : "hint_cable");
        html = `<b style="font-size:17px">${t("state_disconnected_title")}</b>${problem ? `<span class="problem">${esc(problem)}</span>` : ""}
          <span class="muted">${hint}</span>
          <div class="btns">${can ? `<button class="btn primary" data-act="${direct ? "usb" : "sheet"}">${t("action_connect")}</button>` : ""}${direct ? `<button class="btn" data-act="sheet">${t("action_choose")}</button>` : ""}<button class="btn" data-act="demo">${t("action_demo")}</button>${installEvent ? `<button class="btn" data-act="install">${t("install_app")}</button>` : ""}</div>`;
      }
      $("connect-body").innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">${html}</div>`;
    }
  }

  // active errors banner
  $("banner").hidden = S.active.length === 0;
  if (S.active.length && renderOverview.bannerKey !== S.activeKey + lang()) {
    renderOverview.bannerKey = S.activeKey + lang();
    $("banner-title").textContent = t("active_errors_count", S.active.length);
    $("banner-list").innerHTML = S.active.map((e) => `<button class="erow" data-err="${e.code}"><span class="code">${e.code}</span><span><span class="t">${esc(errorTitle(e.code))}</span>${errorDetail(e.code, e.args) ? `<span class="d" style="display:block">${esc(errorDetail(e.code, e.args))}</span>` : ""}</span></button>`).join("");
  }

  for (const el of sigEls) el.classList.toggle("on", f.signals[el.dataset.sig] === true);

  // pressure
  setGauge(f.pfront, f.pideal);
  $("gauge").classList.toggle("out", !f.pressureInRange);
  const ps = $("p-state");
  ps.textContent = !f.complete ? t("no_data") : t(f.pressureInRange ? "pressure_in_range" : "pressure_out_of_range");
  ps.style.color = !f.complete ? "var(--muted)" : f.pressureInRange ? "var(--ok)" : "var(--amber)";
  $("m-pideal").textContent = f.complete ? f.pideal + " mbar" : "—";
  $("m-sheet").textContent = f.expectedPideal === null ? "—" : f.expectedPideal + " mbar";
  $("m-sheet").classList.toggle("bad", f.expectedPideal !== null && f.expectedPideal !== f.pideal);

  // door
  $("door-state").textContent = t("door_" + f.door);
  $("door-state").style.color = f.door === "half" ? "var(--amber)" : "var(--text)";
  const leaf = $("door-leaf");
  leaf.classList.toggle("inflate", !!f.signals.INFSEAL);
  leaf.classList.toggle("deflate", !f.signals.INFSEAL && !!f.signals.DEFSEAL);
  leaf.classList.toggle("pushed", f.door === "pushed");
  $("door-diaph").classList.toggle("on", !!f.signals.DIAPH);
  $("bolt-left").setAttribute("class", "bolt left " + f.leftBolt);
  $("bolt-right").setAttribute("class", "bolt right " + f.rightBolt);

  // lights
  const ls = $("lights-state");
  ls.textContent = t("lights_" + f.lights);
  ls.style.color = { off: "var(--muted)", twoRed: "var(--lamp-red)", invalid: "var(--bad)" }[f.lights] || "var(--text)";

  // coupling, key, heating
  seg("seg-coupling", f.coupling);
  $("coupling-state").textContent = f.coupling === "none" ? t("coupling_none") : "";
  seg("seg-key", f.key);
  $("key-present").textContent = f.signals.KEYACT ? t("key_present") : t("key_absent");
  seg("seg-heater", f.heater);
  $("lowtemp").hidden = !f.signals.LOWTEMP;

  // status lamps burn when the "No … fault" bit is 0
  for (const s of LAMPS) {
    const fault = f.complete && f.signals[s] !== true;
    document.querySelector(`[data-fault="${s}"]`).classList.toggle("fault", fault);
    document.querySelector(`[data-lamp="${s}"]`).classList.toggle("on", fault);
  }
}
function seg(id, value) {
  for (const el of $(id).children) el.classList.toggle("active", el.dataset.v === value);
}

function renderErrors() {
  const ended = S.history.filter((e) => e.clearedAt !== null);
  let html = `<h2 class="label">${t("errors_active")}</h2>`;
  html += S.active.length ? S.active.map((e) => ecard(e.code, e.args, t("since_time", timeStr(e.since)), true)).join("")
    : `<div class="ok-box"><svg viewBox="0 0 24 24" width="24" height="24" fill="var(--ok)"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-2 15-5-5 1.4-1.4L10 14.2l7.6-7.6L19 8l-9 9z"/></svg><span>${t("errors_none")}</span></div>`;
  html += `<div class="head"><h2 class="label">${t("errors_history")}</h2>${ended.length ? `<button class="textbtn" data-act="clear-history">${t("action_clear")}</button>` : ""}</div>`;
  html += ended.length ? ended.map((e) => ecard(e.code, e.args, `${timeStr(e.raisedAt)} – ${timeStr(e.clearedAt)}`, false)).join("") : `<span class="muted" style="padding:4px">${t("errors_history_empty")}</span>`;
  html += `<h2 class="label">${t("errors_catalog")}</h2>` + ERROR_CODES.map((c) => `<button class="cat" data-err="${c}"><b>${c}</b><span>${esc(errorTitle(c))}</span></button>`).join("");
  $("errors-list").innerHTML = html;
}
function ecard(code, args, time, active) {
  const d = errorDetail(code, args);
  return `<button class="ecard${active ? " active" : ""}" data-err="${code}"><span class="code">${code}</span><span><b style="font-weight:500">${esc(errorTitle(code))}</b>${d ? `<small>${esc(d)}</small>` : ""}<small>${esc(time)}</small></span></button>`;
}

function renderRegisters() {
  const st = S.status, on = st.state === "on";
  $("r-rt").textContent = on ? st.rt + " ms" : "—";
  $("r-fps").textContent = on ? st.fps : "—";
  $("r-plc").textContent = st.plcName || "—";
  const u = S.usbInfo;
  $("usb-card").hidden = !u;
  if (u) {
    $("usb-name").textContent = [u.maker, u.product].filter(Boolean).join(" ");
    $("usb-type").textContent = u.type === "?" ? "—" : "PL2303 " + u.type;
    $("usb-ids").textContent = u.vidPid;
    $("usb-rev").textContent = u.bcdDevice + " / USB " + u.bcdUsb;
    $("usb-bytes").textContent = u.rxBytes + " / " + u.txBytes;
    const steps = u.steps.map(esc).join("<br>");
    if ($("usb-steps").innerHTML !== steps) $("usb-steps").innerHTML = steps;
  }
  const regs = (S.front && S.front.registers) || {};
  for (const r of RM.pollOrder) {
    const v = regs[r];
    $("rv-" + r).textContent = v === undefined ? "—" : RM.analog.has(r) ? v + " mbar" : `${v}  ·  ${v.toString(2).padStart(8, "0")}`;
    if (RM.bits[r]) RM.bits[r].forEach((n, i) => $(`rb-${r}-${i}`).classList.toggle("on", v !== undefined && RM.isSet(v, i)));
  }
  if (termDirty) {
    termDirty = false;
    $("term-out").hidden = S.terminal.length === 0;
    $("term-clear").hidden = S.terminal.length === 0;
    $("term-out").innerHTML = S.terminal.slice(-40).reverse().map((l) => `<div class="${l.out ? "o" : ""}">${l.out ? "→" : "←"} ${esc(l.text)}</div>`).join("");
  }
}

/* ---------- sheets ---------- */
function openSheet(html) {
  $("overlay").innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
}
function closeSheet() { $("overlay").innerHTML = ""; }
async function connectionSheet() {
  const st = S.status;
  let html = `<h2>${t("card_connection")}</h2>`;
  if (st.state !== "off") {
    html += `<span class="muted">${esc(st.state === "on" ? t("connected_to", st.plcName || "PLC", st.linkName) : t("state_connecting_long", st.linkName))}</span><button class="btn danger" data-act="stop">${t("action_disconnect")}</button>`;
  }
  const known = await knownPorts();
  known.forEach((p, i) => {
    html += `<button class="port${p.kit ? " kit" : ""}" data-known="${i}"><div><b>${esc(t("port_known"))}</b><small>${esc(p.kind === "usb" ? (p.port.productName || "Prolific PL2303") + " · WebUSB" : "Web Serial")}${p.kit ? " · " + t("port_kit_cable") : ""}</small></div>▶</button>`;
  });
  const serialBtn = `<button class="port" data-act="serial" ${navigator.serial ? "" : "disabled"}><div><b>${t("port_serial")}</b><small>${t("port_serial_sub")}</small></div>▶</button>`;
  const usbBtn = `<button class="port${isAndroid ? " kit" : ""}" data-act="usb" ${navigator.usb ? "" : "disabled"}><div><b>${t("port_usb")}${isAndroid ? ` · ${t("recommended")}` : ""}</b><small>${t("port_usb_sub")}</small></div>▶</button>`;
  html += isAndroid ? usbBtn + serialBtn : serialBtn + usbBtn;
  if (navigator.usb) html += `<button class="port" data-act="usb-any"><div><b>${t("port_usb_any")}</b><small>${t("port_usb_any_sub")}</small></div>▶</button>`;
  html += `<button class="port" data-act="demo"><div><b>${t("demo_title")}</b><small>${t("demo_subtitle")}</small></div>▶</button>`;
  if (!navigator.serial && !navigator.usb) html += `<span class="muted">${t("no_usb")}</span>`;
  else if (S.blocked) html += `<span class="muted">${t("usb_blocked")}</span>`;
  openSheet(html);
  connectionSheet.known = known;
}
function errorSheet(code) {
  const active = S.active.find((e) => e.code === code);
  const group = explanation(Math.floor(code / 10) * 10).split("\n")[0];
  const detail = active ? (errorDetail(code, active.args) || t("error_active_now")) : "";
  openSheet(`<div class="row"><span style="font-size:40px;font-weight:700;color:${active ? "var(--bad)" : "var(--amber)"}">${code}</span><div>${group ? `<small class="muted">${esc(group)}</small>` : ""}<h2 style="font-size:17px">${esc(errorTitle(code))}</h2></div></div>
    ${active ? `<div class="ok-box" style="background:color-mix(in srgb,var(--bad) 12%,transparent)">${esc(detail)}</div>` : ""}
    <div class="explain">${esc(explanation(code) || t("error_no_explanation"))}</div>
    <div><button class="btn" data-act="close-sheet">${t("close")}</button></div>`);
}

let snackTimer = null;
function snack(text) {
  const el = $("snack");
  el.textContent = text;
  el.hidden = false;
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { el.hidden = true; }, 4000);
}

/* ---------- language + settings page ---------- */
let applyLanguage = function () {
  document.documentElement.lang = lang();
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const b of $("langs").children) b.classList.toggle("active", b.dataset.l === S.settings.lang);
  $("support").textContent = t("support", navigator.serial ? t("yes") : t("no"), navigator.usb ? t("yes") : t("no"));
  renderOverview.connKey = null;
  errorsDirty = true;
  termDirty = true;
  renderSettings();
  schedule();
}
function renderSettings() {
  const s = S.settings;
  $("s-auto").checked = s.autoConnect;
  $("s-notify").checked = s.notify;
  $("s-screen").checked = s.keepScreenOn;
  $("s-timeout").value = s.plcTimeoutS; $("s-timeout-v").textContent = s.plcTimeoutS + " s";
  $("s-pressure").value = s.pressureTimeoutS; $("s-pressure-v").textContent = s.pressureTimeoutS + " s";
  $("s-delay").value = s.errorDelayS; $("s-delay-v").textContent = s.errorDelayS.toLocaleString(lang()) + " s";
}
function setSetting(key, value) {
  S.settings[key] = value;
  saveSettings();
  applySettings();
  renderSettings();
  updateWakeLock();
}
[["s-auto", "autoConnect"], ["s-notify", "notify"], ["s-screen", "keepScreenOn"]].forEach(([id, key]) => {
  $(id).addEventListener("change", (e) => setSetting(key, e.target.checked));
});
[["s-timeout", "plcTimeoutS"], ["s-pressure", "pressureTimeoutS"], ["s-delay", "errorDelayS"]].forEach(([id, key]) => {
  $(id).addEventListener("input", (e) => { $(id + "-v").textContent = (+e.target.value).toLocaleString(lang()) + " s"; });
  $(id).addEventListener("change", (e) => setSetting(key, +e.target.value));
});
$("langs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  S.settings.lang = b.dataset.l;
  saveSettings();
  applyLanguage();
});
$("s-reset").addEventListener("click", () => { S.settings = { ...DEFAULTS, lang: S.settings.lang }; saveSettings(); applySettings(); applyLanguage(); });

/* ---------- events ---------- */
function showTab(tab) {
  S.tab = tab;
  for (const b of document.querySelectorAll("nav.tabs button")) {
    if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  for (const p of document.querySelectorAll(".page")) p.hidden = p.id !== "page-" + tab;
  errorsDirty = true;
  termDirty = true;
  renderOverview.connKey = null;
  try { localStorage.setItem("fsd-tab", tab); } catch (_) { /* ignore */ }
  window.scrollTo(0, 0);
  render();
}
document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-tab]");
  if (b) showTab(b.dataset.tab);
});
$("pill").addEventListener("click", connectionSheet);
$("banner-all").addEventListener("click", () => showTab("errors"));

document.addEventListener("click", (e) => {
  const err = e.target.closest("[data-err]");
  if (err) { errorSheet(+err.dataset.err); return; }
  const known = e.target.closest("[data-known]");
  if (known) {
    const p = connectionSheet.known[+known.dataset.known];
    closeSheet();
    if (p.kind === "serial") startSerial(p.port); else startUsb(p.port);
    return;
  }
  const quick = e.target.closest("[data-cmd]");
  if (quick) { conn.send(quick.dataset.cmd); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  switch (act.dataset.act) {
    case "close-sheet": if (e.target === act || act.tagName === "BUTTON") closeSheet(); break;
    case "sheet": connectionSheet(); break;
    case "demo": closeSheet(); startDemo(); break;
    case "serial": closeSheet(); startSerial(); break;
    case "usb": closeSheet(); startUsb(); break;
    case "usb-any": closeSheet(); startUsb(null, true); break;
    case "stop": closeSheet(); stop(); break;
    case "install": install(); break;
    case "clear-history": diag.clearHistory(); S.history = diag.events(); errorsDirty = true; schedule(); break;
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
$("term-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("term-input");
  if (input.value.trim()) conn.send(input.value);
  input.value = "";
});
$("term-clear").addEventListener("click", () => { S.terminal = []; termDirty = true; schedule(); });

/* ---------- start ---------- */
applyLanguage();
let startTab = "overview";
try { startTab = localStorage.getItem("fsd-tab") || "overview"; } catch (_) { /* ignore */ }
const hashTab = location.hash.replace("#", "");
if (["overview", "errors", "registers", "settings"].includes(hashTab)) startTab = hashTab;
/* ---------- installable app (PWA) ---------- */
let installEvent = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
function renderInstall() {
  $("install-card").hidden = !(installEvent || standalone());
  $("s-install").hidden = !installEvent;
  $("install-state").textContent = standalone() ? t("install_running") : t("install_hint");
  renderOverview.connKey = null;
  schedule();
}
async function install() {
  if (!installEvent) return;
  const e = installEvent;
  installEvent = null;
  try { await e.prompt(); await e.userChoice; } catch (_) { /* dismissed */ }
  renderInstall();
}
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; renderInstall(); });
window.addEventListener("appinstalled", () => { installEvent = null; snack(t("install_done")); renderInstall(); });
$("s-install").addEventListener("click", install);
const origApplyLanguage = applyLanguage;
applyLanguage = function () { origApplyLanguage(); renderInstall(); };
renderInstall();

// offline cache + "new version" message; only on the hosted app (it has a manifest)
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then((reg) => {
    reg.addEventListener("updatefound", () => {
      const worker = reg.installing;
      if (worker) worker.addEventListener("statechange", () => { if (worker.state === "activated" && hadController) snack(t("update_ready")); });
    });
  }).catch(() => { /* no offline cache */ });
}

// app shortcuts (#demo, #errors) also work while the app is already open
window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "");
  if (h === "demo") { showTab("overview"); if (S.status.state === "off") startDemo(); }
  else if (["overview", "errors", "registers", "settings"].includes(h)) showTab(h);
});

showTab(startTab);
autoConnect();
if (location.hash === "#demo") startDemo();
window.fsdSelfTest = fsdSelfTest;
</script>
